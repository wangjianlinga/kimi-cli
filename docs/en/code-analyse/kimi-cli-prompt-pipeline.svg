<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1020" width="1100" height="1020">
  <defs>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-ctrl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-loop" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-light" x="-2%" y="-2%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #111827; }
    .section-title { font-size: 15px; font-weight: 600; fill: #374151; }
    .label { font-size: 13px; font-weight: 500; fill: #1f2937; }
    .sublabel { font-size: 11px; fill: #6b7280; }
    .code { font-size: 11px; font-family: "SF Mono", "Consolas", "Monaco", monospace; fill: #4b5563; }
  </style>

  <!-- Background -->
  <rect width="1100" height="1020" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="36" class="title" text-anchor="middle">Kimi-CLI Prompt Construction Pipeline</text>
  <text x="550" y="54" class="sublabel" text-anchor="middle">From Agent YAML to System Prompt to Context to Anthropic API</text>

  <!-- Phase 1: Agent Configuration -->
  <rect x="20" y="70" width="1060" height="170" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="6,3"/>
  <rect x="20" y="70" width="220" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="130" y="88" class="section-title" text-anchor="middle" fill="#1d4ed8">1. Agent Configuration Loading</text>
  <rect x="50" y="110" width="150" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="125" y="131" class="label" text-anchor="middle">agent.yaml</text>
  <text x="125" y="148" class="code" text-anchor="middle">name, tools, extend,</text>
  <text x="125" y="161" class="code" text-anchor="middle">system_prompt_path</text>
  <line x1="200" y1="135" x2="255" y2="135" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="260" y="110" width="175" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="347" y="128" class="label" text-anchor="middle">_load_agent_spec()</text>
  <text x="347" y="145" class="code" text-anchor="middle">YAML -> AgentSpec pydantic</text>
  <text x="347" y="158" class="sublabel" text-anchor="middle">extend chain resolution</text>
  <line x1="435" y1="135" x2="490" y2="135" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="495" y="110" width="175" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="582" y="128" class="label" text-anchor="middle">system.md</text>
  <text x="582" y="145" class="code" text-anchor="middle">Jinja2 template, ~160 lines</text>
  <text x="582" y="158" class="sublabel" text-anchor="middle">$ sign VAR syntax</text>
  <line x1="670" y1="135" x2="725" y2="135" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="730" y="110" width="170" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="815" y="128" class="label" text-anchor="middle">_load_system_prompt()</text>
  <text x="815" y="145" class="code" text-anchor="middle">Jinja2.render(args)</text>
  <text x="815" y="158" class="sublabel" text-anchor="middle">StrictUndefined errors</text>
  <rect x="730" y="180" width="170" height="40" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="815" y="196" class="label" text-anchor="middle">BuiltinSystemPromptArgs</text>
  <text x="815" y="212" class="code" text-anchor="middle">KIMI_OS, KIMI_SHELL, KIMI_NOW,</text>
  <line x1="815" y1="180" x2="815" y2="162" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-ctrl)"/>
  <rect x="50" y="185" width="200" height="40" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="150" y="201" class="label" text-anchor="middle">KimiToolset.load_tools()</text>
  <text x="150" y="216" class="code" text-anchor="middle">Dependency Injection (IOC container)</text>
  <rect x="920" y="120" width="150" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="142" class="label" text-anchor="middle" fill="#1d4ed8">Agent</text>
  <text x="995" y="158" class="code" text-anchor="middle">_system_prompt: str</text>
  <text x="995" y="173" class="code" text-anchor="middle">_toolset: Toolset</text>
  <line x1="900" y1="150" x2="918" y2="150" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>

  <!-- Phase 2: Turn Lifecycle -->
  <rect x="20" y="255" width="1060" height="185" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="6,3"/>
  <rect x="20" y="255" width="195" height="26" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="117" y="273" class="section-title" text-anchor="middle" fill="#047857">2. Turn Execution Loop</text>
  <rect x="50" y="295" width="140" height="45" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="120" y="314" class="label" text-anchor="middle">User Input</text>
  <text x="120" y="330" class="code" text-anchor="middle">str | ContentPart[]</text>
  <line x1="190" y1="317" x2="240" y2="317" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="245" y="295" width="150" height="45" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="320" y="312" class="label" text-anchor="middle">KimiSoul.run()</text>
  <text x="320" y="328" class="code" text-anchor="middle">Hooks: UserPromptSubmit</text>
  <line x1="395" y1="317" x2="445" y2="317" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="450" y="295" width="150" height="45" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="525" y="312" class="label" text-anchor="middle">_turn(user_message)</text>
  <text x="525" y="328" class="code" text-anchor="middle">checkpoint + append msg</text>
  <line x1="600" y1="317" x2="645" y2="317" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="650" y="295" width="180" height="45" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="740" y="312" class="label" text-anchor="middle">_agent_loop() -- Step Loop</text>
  <text x="740" y="328" class="code" text-anchor="middle">MCP load -> step guard -> step</text>
  <line x1="830" y1="317" x2="880" y2="317" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="885" y="295" width="170" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="970" y="312" class="label" text-anchor="middle" fill="#1d4ed8">_step()</text>
  <text x="970" y="328" class="code" text-anchor="middle">Core: LLM call + tool exec</text>
  <text x="740" y="370" class="sublabel" text-anchor="middle">Per-step cycle: 2a.Guard -> 2b.StepBegin -> 2c.Auto-Compact -> 2d.Checkpoint -> 2e._step()</text>
  <text x="740" y="386" class="sublabel" text-anchor="middle">Error handling: BackToTheFuture / revert; Outcome: steers / stop / continue</text>
  <path d="M 830 340 Q 830 405 740 405" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-loop)"/>
  <text x="790" y="398" class="sublabel" fill="#7c3aed">loop: max_steps_per_turn</text>

  <!-- Phase 3: Step Execution Detail -->
  <rect x="20" y="455" width="1060" height="215" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="6,3"/>
  <rect x="20" y="455" width="210" height="26" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="125" y="473" class="section-title" text-anchor="middle" fill="#b45309">3. Step Processing (2e.1 - 2e.4)</text>
  <rect x="40" y="500" width="155" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="117" y="520" class="label" text-anchor="middle">2e.1 Notifications</text>
  <text x="117" y="536" class="sublabel" text-anchor="middle">deliver_pending("llm")</text>
  <text x="117" y="550" class="code" text-anchor="middle">-> user messages</text>
  <line x1="195" y1="527" x2="240" y2="527" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="245" y="500" width="160" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="325" y="520" class="label" text-anchor="middle">2e.2 Dynamic Injection</text>
  <text x="325" y="536" class="sublabel" text-anchor="middle">_collect_injections()</text>
  <text x="325" y="550" class="code" text-anchor="middle">&lt;system-reminder&gt; tags</text>
  <line x1="405" y1="527" x2="450" y2="527" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="455" y="500" width="170" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="540" y="518" class="label" text-anchor="middle">2e.3 normalize_history()</text>
  <text x="540" y="536" class="sublabel" text-anchor="middle">Merge adjacent user msgs</text>
  <text x="540" y="550" class="code" text-anchor="middle">Context.history -> API input</text>
  <line x1="625" y1="527" x2="670" y2="527" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="675" y="500" width="155" height="55" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="752" y="520" class="label" text-anchor="middle">effective_history</text>
  <text x="752" y="536" class="sublabel" text-anchor="middle">list[Message] normalized</text>
  <text x="752" y="550" class="code" text-anchor="middle">user / assistant / tool</text>
  <line x1="830" y1="527" x2="925" y2="527" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-main)"/>
  <text x="877" y="520" class="sublabel" text-anchor="middle">+ system_prompt + toolset</text>
  <rect x="930" y="495" width="130" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="515" class="label" text-anchor="middle" fill="#1d4ed8">kosong.step()</text>
  <text x="995" y="533" class="code" text-anchor="middle">chat_provider</text>
  <text x="995" y="548" class="code" text-anchor="middle">system_prompt</text>
  <text x="995" y="563" class="code" text-anchor="middle">toolset</text>
  <rect x="40" y="585" width="200" height="40" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="140" y="601" class="label" text-anchor="middle">KimiToolset.begin_step()</text>
  <text x="140" y="616" class="code" text-anchor="middle">Reset per-step dedup state</text>
  <rect x="285" y="585" width="210" height="40" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="390" y="601" class="label" text-anchor="middle">Retry: tenacity.retry decorator</text>
  <text x="390" y="616" class="code" text-anchor="middle">exponential jitter, max_retries_per_step</text>
  <rect x="540" y="585" width="200" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="640" y="601" class="label" text-anchor="middle">2e.7 _grow_context()</text>
  <text x="640" y="616" class="code" text-anchor="middle">assistant_msg + tool_results -> context</text>
  <rect x="785" y="585" width="180" height="40" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="875" y="601" class="label" text-anchor="middle">2e.8 Outcome Resolution</text>
  <text x="875" y="616" class="code" text-anchor="middle">no_tool_calls / tool_rejected / continue</text>
  <line x1="995" y1="562" x2="995" y2="690" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-main)"/>

  <!-- Phase 4: kosong generate and API Call -->
  <rect x="20" y="695" width="1060" height="175" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="6,3"/>
  <rect x="20" y="695" width="220" height="26" rx="6" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
  <text x="130" y="713" class="section-title" text-anchor="middle" fill="#be185d">4. LLM API Call Construction</text>
  <rect x="50" y="740" width="180" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="140" y="760" class="label" text-anchor="middle">kosong.generate()</text>
  <text x="140" y="777" class="code" text-anchor="middle">Streaming loop: parts -> merge</text>
  <text x="140" y="792" class="code" text-anchor="middle">ToolCall / TextPart / ThinkPart</text>
  <line x1="230" y1="767" x2="280" y2="767" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="285" y="740" width="190" height="55" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow-light)"/>
  <text x="380" y="758" class="label" text-anchor="middle">ChatProvider.generate()</text>
  <text x="380" y="775" class="code" text-anchor="middle">AnthropicChatProvider impl</text>
  <text x="380" y="792" class="code" text-anchor="middle">_convert_message() per msg</text>
  <line x1="475" y1="767" x2="530" y2="767" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-main)"/>
  <rect x="535" y="730" width="525" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="797" y="752" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="600">Anthropic API: client.messages.create()</text>
  <text x="797" y="772" text-anchor="middle" fill="#94a3b8" font-size="11">POST https://api.anthropic.com/v1/messages</text>
  <rect x="552" y="785" width="155" height="62" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="629" y="802" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">system</text>
  <text x="629" y="822" fill="#cbd5e1" font-size="10.5" text-anchor="middle">[TextBlockParam(</text>
  <text x="629" y="836" fill="#cbd5e1" font-size="10.5" text-anchor="middle">  system_prompt,</text>
  <text x="629" y="850" fill="#cbd5e1" font-size="10.5" text-anchor="middle">  cache_control)]</text>
  <rect x="720" y="785" width="155" height="62" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="797" y="802" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">messages</text>
  <text x="797" y="822" fill="#cbd5e1" font-size="10.5" text-anchor="middle">[converted history]</text>
  <text x="797" y="836" fill="#cbd5e1" font-size="10.5" text-anchor="middle">user / assistant roles</text>
  <text x="797" y="850" fill="#cbd5e1" font-size="10.5" text-anchor="middle">last block: cache_control</text>
  <rect x="888" y="785" width="155" height="62" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="965" y="802" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="600">tools</text>
  <text x="965" y="822" fill="#cbd5e1" font-size="10.5" text-anchor="middle">[converted Tool defs]</text>
  <text x="965" y="836" fill="#cbd5e1" font-size="10.5" text-anchor="middle">JSON Schema params</text>
  <text x="965" y="850" fill="#cbd5e1" font-size="10.5" text-anchor="middle">last tool: cache_control</text>

  <!-- Phase 5: Context Compaction -->
  <rect x="20" y="885" width="1060" height="125" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="6,3"/>
  <rect x="20" y="885" width="210" height="26" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="125" y="903" class="section-title" text-anchor="middle" fill="#6d28d9">5. Context Compaction (auto-trigger)</text>
  <rect x="40" y="925" width="180" height="40" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="130" y="941" class="label" text-anchor="middle">should_auto_compact()</text>
  <text x="130" y="956" class="code" text-anchor="middle">token_count &gt;= trigger_ratio * max</text>
  <line x1="220" y1="945" x2="270" y2="945" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-loop)"/>
  <rect x="275" y="925" width="175" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="362" y="941" class="label" text-anchor="middle">SimpleCompaction.prepare()</text>
  <text x="362" y="956" class="code" text-anchor="middle">split: to_compact + to_preserve</text>
  <line x1="450" y1="945" x2="500" y2="945" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-loop)"/>
  <rect x="505" y="925" width="200" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="605" y="941" class="label" text-anchor="middle">kosong.step() - compaction LLM</text>
  <text x="605" y="956" class="code" text-anchor="middle">EmptyToolset + COMPACT prompt</text>
  <line x1="705" y1="945" x2="760" y2="945" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-loop)"/>
  <rect x="765" y="925" width="230" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="880" y="941" class="label" text-anchor="middle" fill="#1d4ed8">summary + preserved tail -> context</text>
  <text x="880" y="956" class="code" text-anchor="middle">Max 2 preserved msgs, ~4 chars/token est</text>
  <path d="M 880 967 Q 880 1005 550 1005 Q 50 1005 50 990" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-loop)"/>
  <text x="450" y="1016" class="sublabel" fill="#7c3aed" text-anchor="middle">Context replacement: compacted messages overwrite history in place</text>

  <rect x="40" y="640" width="180" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="130" y="656" class="label" text-anchor="middle">Context.history: list[Message]</text>
  <text x="130" y="671" class="code" text-anchor="middle">JSONL file backend</text>
  <path d="M 220 660 L 450 660 L 450 555" stroke="#059669" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-data)"/>
  <path d="M 640 660 Q 640 640 540 640" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#arrow-data)"/>
  <text x="590" y="655" class="sublabel" fill="#059669" text-anchor="middle">build &amp; append_message</text>

  <!-- Legend -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="220" height="20" rx="4" fill="#ffffff" fill-opacity="0.95"/>
    <line x1="4" y1="10" x2="30" y2="10" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-main)"/>
    <text x="34" y="14" class="sublabel">Main Data Flow</text>
    <line x1="110" y1="10" x2="136" y2="10" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-loop)"/>
    <text x="140" y="14" class="sublabel">Compaction / Loop</text>
  </g>
</svg>